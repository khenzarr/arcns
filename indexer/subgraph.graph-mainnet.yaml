# The Graph Studio mainnet backup; slug arc-ns-mainnet.
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ArcController
    network: arc
    source:
      address: "0xE62De42eAcb270D2f2465c017C30bbf24F3f9350"
      abi: Controller
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Domain
        - Registration
        - Renewal
        - Account
        - DomainEvent
      abis:
        - name: Controller
          file: ./abis/ArcNSRegistrarControllerV2.json
      eventHandlers:
        - event: NameRegistered(string,indexed bytes32,indexed address,uint256,uint256)
          handler: handleArcNameRegistered
        - event: NameRenewed(string,indexed bytes32,uint256,uint256)
          handler: handleArcNameRenewed
      file: ./src/controller.ts
  - kind: ethereum
    name: CircleController
    network: arc
    source:
      address: "0x5A1275Ed5638C9aD5005d6087c696BFb3848e9E1"
      abi: Controller
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Domain
        - Registration
        - Renewal
        - Account
        - DomainEvent
      abis:
        - name: Controller
          file: ./abis/ArcNSRegistrarControllerV2.json
      eventHandlers:
        - event: NameRegistered(string,indexed bytes32,indexed address,uint256,uint256)
          handler: handleCircleNameRegistered
        - event: NameRenewed(string,indexed bytes32,uint256,uint256)
          handler: handleCircleNameRenewed
      file: ./src/controller.ts
  - kind: ethereum
    name: ArcRegistrar
    network: arc
    source:
      address: "0x6C6C0d5B38B3a69F53301CEe0ba360E02d53933d"
      abi: BaseRegistrar
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Domain
        - Account
        - DomainEvent
      abis:
        - name: BaseRegistrar
          file: ./abis/ArcNSBaseRegistrar.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleArcTransfer
      file: ./src/registrar.ts
  - kind: ethereum
    name: CircleRegistrar
    network: arc
    source:
      address: "0x1c23D75E0c7a3B9E9eD4CcEea0e97CDCFB0E9A9C"
      abi: BaseRegistrar
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Domain
        - Account
        - DomainEvent
      abis:
        - name: BaseRegistrar
          file: ./abis/ArcNSBaseRegistrar.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleCircleTransfer
      file: ./src/registrar.ts
  - kind: ethereum
    name: Resolver
    network: arc
    source:
      address: "0x68Bb5D43E8c7394876de2174d1BA320745D47023"
      abi: Resolver
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Domain
        - ResolverRecord
      abis:
        - name: Resolver
          file: ./abis/ArcNSResolverV2.json
      eventHandlers:
        - event: AddrChanged(indexed bytes32,address)
          handler: handleAddrChanged
        - event: NameChanged(indexed bytes32,string)
          handler: handleNameChanged
      file: ./src/resolver.ts
  - kind: ethereum
    name: Registry
    network: arc
    source:
      address: "0xcA4d60A6d237EDa59aA1F57EbAe6B3150BcAb8Fb"
      abi: Registry
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Domain
        - DomainEvent
      abis:
        - name: Registry
          file: ./abis/ArcNSRegistry.json
      eventHandlers:
        - event: Transfer(indexed bytes32,address)
          handler: handleTransfer
        - event: NewResolver(indexed bytes32,address)
          handler: handleNewResolver
      file: ./src/registry.ts
  - kind: ethereum
    name: ReverseRegistrar
    network: arc
    source:
      address: "0x3731b7c9F1830aD2880020DfcB0A4714E7fc252a"
      abi: ReverseRegistrar
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ReverseRecord
        - Account
      abis:
        - name: ReverseRegistrar
          file: ./abis/ArcNSReverseRegistrar.json
      eventHandlers:
        - event: ReverseClaimed(indexed address,indexed bytes32)
          handler: handleReverseClaimed
      file: ./src/reverseRegistrar.ts
  - kind: ethereum
    name: DiscountRegistry
    network: arc
    source:
      abi: ArcNSEarlyAdopterDiscountRegistry
      address: "0xEec7ac0d3C3bE402b6F2b492c7479B2897e64BA2"
      startBlock: 21070696
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DiscountRegistryState
        - DiscountController
        - DiscountRootUpdate
        - DiscountRootFrozen
        - DiscountActivationChange
        - DiscountControllerAuthorization
        - DiscountConsumed
        - DiscountRegistryOwnershipTransfer
      abis:
        - name: ArcNSEarlyAdopterDiscountRegistry
          file: ./abis/ArcNSEarlyAdopterDiscountRegistry.json
      eventHandlers:
        - event: DiscountRootUpdated(indexed bytes32,indexed bytes32)
          handler: handleDiscountRootUpdated
        - event: DiscountRootFrozen(indexed bytes32)
          handler: handleDiscountRootFrozen
        - event: DiscountActiveUpdated(bool)
          handler: handleDiscountActiveUpdated
        - event: DiscountControllerAuthorizationUpdated(indexed address,bool)
          handler: handleDiscountControllerAuthorizationUpdated
        - event: DiscountUsed(indexed address,indexed address,indexed bytes32)
          handler: handleDiscountUsed
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/discountRegistry.ts
templates:
  - kind: ethereum
    name: DiscountRegistry
    network: arc
    source:
      abi: ArcNSEarlyAdopterDiscountRegistry
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DiscountRegistryState
        - DiscountController
        - DiscountRootUpdate
        - DiscountRootFrozen
        - DiscountActivationChange
        - DiscountControllerAuthorization
        - DiscountConsumed
        - DiscountRegistryOwnershipTransfer
      abis:
        - name: ArcNSEarlyAdopterDiscountRegistry
          file: ./abis/ArcNSEarlyAdopterDiscountRegistry.json
      eventHandlers:
        - event: DiscountRootUpdated(indexed bytes32,indexed bytes32)
          handler: handleDiscountRootUpdated
        - event: DiscountRootFrozen(indexed bytes32)
          handler: handleDiscountRootFrozen
        - event: DiscountActiveUpdated(bool)
          handler: handleDiscountActiveUpdated
        - event: DiscountControllerAuthorizationUpdated(indexed address,bool)
          handler: handleDiscountControllerAuthorizationUpdated
        - event: DiscountUsed(indexed address,indexed address,indexed bytes32)
          handler: handleDiscountUsed
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/discountRegistry.ts
